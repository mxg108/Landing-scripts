  <!-- Sections 2 and 3 (WebApp_Config, WebApp_Preview) will be included here once built. -->

  <script>
    /**
     * google.script.run — how the browser talks to WebApp.gs
     *
     * Pattern:
     *   google.script.run
     *     .withSuccessHandler(fn)   ← called with the return value on success
     *     .withFailureHandler(fn)   ← called with the Error object on failure
     *     .yourServerFunction(args) ← any public function in WebApp.gs
     *
     * This is asynchronous — the browser doesn't block while GAS runs.
     */
    document.addEventListener('DOMContentLoaded', function () {
      google.script.run
        .withSuccessHandler(function (data) {
          // data = { config, recipients, templates, cards }
          // Hand each piece off to its section's init function.
          Recipients.init(data.recipients, data.config.maxPerRun);
          // Config.init(data)    ← coming next
          // Preview.init(data)   ← coming after that
        })
        .withFailureHandler(function (err) {
          console.error('Failed to load initial data:', err.message);
        })
        .getInitialData();
    });
  </script>

</body>
