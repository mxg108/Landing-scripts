  <?!= include('webapp/WebApp_Send') ?>

  <script>
    // Capture the Web App URL before any GAS internal redirects alter it.
    // Used by the Send module to navigate back to this exact URL after a reset,
    // since window.location.reload() can land on a blank GAS redirect page.
    var __webAppUrl = window.location.href;

    document.addEventListener('DOMContentLoaded', function () {
      google.script.run
        .withSuccessHandler(function (data) {
          if (!data) {
            console.error('getInitialData returned null — likely a GAS serialisation error. Check server logs.');
            return;
          }
          // data = { config, recipients, templates, cards }
          Recipients.init(data.recipients, data.config.maxPerRun);
          Config.init(data);
          // Seed the send summary with the loaded values.
          Send.updateSummary(data.recipients.length, data.config);
        })
        .withFailureHandler(function (err) {
          console.error('Failed to load initial data:', err.message);
        })
        .getInitialData();
    });
  </script>

</body>
