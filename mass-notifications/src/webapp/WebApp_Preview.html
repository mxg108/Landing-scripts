<style>
  /* ── Section card ────────────────────────────────────────────────────────── */
  /* Section card scaffolding lives in Index.html. */

  /* ── Header row ──────────────────────────────────────────────────────────── */
  #preview-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  #section-preview h2 { color: #fff; }
  #preview-recipient-tag {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    color: rgba(255, 255, 255, 0.85);
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: var(--radius-pill);
    padding: 3px 10px;
    display: none;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  /* ── Refresh button ──────────────────────────────────────────────────────── */
  #btn-preview-refresh {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    font-weight: 500;
    padding: 6px 14px;
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: var(--radius-ctrl);
    background: transparent;
    color: #fff;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background .15s, border-color .15s;
  }
  #btn-preview-refresh:hover:not(:disabled) {
    background: rgba(255, 255, 255, 0.1);
    border-color: rgba(255, 255, 255, 0.5);
  }
  #btn-preview-refresh:disabled { opacity: .5; cursor: default; }

  /* ── Spinner (reuse animation from Send section) ─────────────────────────── */
  .preview-spinner {
    display: inline-block;
    width: 12px; height: 12px;
    border: 2px solid rgba(255,255,255,.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    vertical-align: middle;
  }

  /* ── Placeholder / idle state ────────────────────────────────────────────── */
  #preview-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 180px;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 0.8rem;
    gap: 10px;
    border: 1px dashed var(--border);
    border-radius: 8px;
  }
  #preview-placeholder svg { opacity: .35; }

  /* Error banner */
  #preview-error {
    display: none;
    background: var(--error-bg);
    border: 1px solid var(--red);
    border-left: 4px solid var(--red);
    color: var(--error);
    border-radius: var(--radius-ctrl);
    padding: 12px 16px;
    font-family: var(--font-mono);
    font-size: 0.8rem;
  }

  /* iframe wrapper: navy top/bottom borders mirror AI-Scoring scorecard panels */
  #preview-frame-wrap {
    display: none;
    border: 1px solid var(--border);
    border-top: 4px solid var(--navy);
    border-bottom: 4px solid var(--navy);
    border-radius: 0;
    overflow: hidden;
    background: var(--surface);
  }
  #preview-frame {
    width: 100%;
    min-height: 500px;
    border: none;
    display: block;
  }

  /* Attachment list */
  #preview-attachments {
    display: none;
    border-top: 1px solid var(--border);
    padding: 10px 14px;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: var(--text);
    line-height: 1.9;
    background: var(--bg);
  }
  #preview-attachments strong {
    color: var(--text);
    font-size: 0.65rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: .08em;
    display: block;
    margin-bottom: 4px;
  }
</style>

<section id="section-preview">
  <div id="preview-header">
    <div style="display:flex;align-items:center;gap:12px;">
      <h2>Email Preview</h2>
      <span id="preview-recipient-tag"></span>
    </div>
    <button type="button" id="btn-preview-refresh">
      &#x1F50D; Refresh Preview
    </button>
  </div>

  <!-- Error banner -->
  <div id="preview-error"></div>

  <!-- Idle / loading placeholder -->
  <div id="preview-placeholder">
    <!-- Envelope icon -->
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none"
         stroke="#15192D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="20" height="16" rx="2"/>
      <path d="M2 7l10 7 10-7"/>
    </svg>
    <span>Click &ldquo;Refresh Preview&rdquo; to render the email</span>
  </div>

  <!-- Rendered preview in a sandboxed iframe -->
  <div id="preview-frame-wrap">
    <iframe id="preview-frame" title="Email preview" sandbox="allow-same-origin"></iframe>
    <div id="preview-attachments"></div>
  </div>
</section>

<script>
/**
 * Preview module — renders a live email preview for the first eligible recipient.
 *
 * Flow:
 *   1. User clicks "Refresh Preview"
 *   2. Client saves recipients + pending config fields to the sheets
 *   3. Server calls buildHtmlBody_() through the real send pipeline
 *   4. HTML is injected into a sandboxed iframe (preserves email CSS, isolates JS)
 */
const Preview = (() => {

  var _loaded = false;

  function _el(id) { return document.getElementById(id); }

  // ── Refresh ────────────────────────────────────────────────────────────────

  function refresh() {
    var btn = _el('btn-preview-refresh');
    btn.disabled   = true;
    btn.innerHTML  = '<span class="preview-spinner"></span> Loading\u2026';

    _el('preview-error').style.display      = 'none';
    _el('preview-placeholder').style.display = 'flex';
    _el('preview-frame-wrap').style.display  = 'none';

    // Save recipients first, then fetch the preview.
    google.script.run
      .withSuccessHandler(function () {
        google.script.run
          .withSuccessHandler(_renderResult)
          .withFailureHandler(_onErr)
          .getEmailPreview();
      })
      .withFailureHandler(_onErr)
      .saveRecipients(Recipients.getRows());
  }

  function _renderResult(result) {
    var btn = _el('btn-preview-refresh');
    btn.disabled  = false;
    btn.innerHTML = '&#x1F50D; Refresh Preview';

    if (result.error) {
      _showError('Preview error: ' + result.error);
      return;
    }

    // Inject into iframe via srcdoc for CSS isolation.
    var frame = _el('preview-frame');
    frame.srcdoc = result.html;

    // Auto-resize iframe to content height after it loads.
    frame.onload = function () {
      try {
        var h = frame.contentDocument.body.scrollHeight;
        if (h > 100) frame.style.minHeight = (h + 32) + 'px';
      } catch (_) { /* cross-origin fallback — keep min-height */ }
    };

    _el('preview-placeholder').style.display = 'none';
    _el('preview-frame-wrap').style.display  = 'block';

    // Recipient tag
    var tag = _el('preview-recipient-tag');
    if (result.recipientEmail) {
      tag.textContent    = 'Previewing for: ' + result.recipientEmail;
      tag.style.display  = 'inline';
    } else {
      tag.textContent    = 'Generic preview (no recipients)';
      tag.style.display  = 'inline';
    }

    // Attachment list
    var attachEl = _el('preview-attachments');
    var att = result.attachments;
    if (attachEl && att && (att.names.length || att.notes.length)) {
      function esc(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }
      var lines = [];
      att.names.forEach(function (n) { lines.push('&#x1F4CE; ' + esc(n)); });
      att.notes.forEach(function (n) { lines.push('<span style="color:#888;">&#x2139;&#xFE0F; ' + esc(n) + '</span>'); });
      attachEl.innerHTML = '<strong>Attachments</strong>' + lines.join('<br>');
      attachEl.style.display = 'block';
    } else if (attachEl) {
      attachEl.style.display = 'none';
    }

    _loaded = true;

    // Keep the Send summary in sync with current live values.
    if (typeof Send !== 'undefined' && Send.refresh) Send.refresh();
  }

  function _onErr(e) {
    var btn = _el('btn-preview-refresh');
    btn.disabled  = false;
    btn.innerHTML = '&#x1F50D; Refresh Preview';
    _showError('Server error: ' + (e && e.message ? e.message : String(e)));
  }

  function _showError(msg) {
    var el = _el('preview-error');
    el.textContent    = msg;
    el.style.display  = 'block';
    _el('preview-placeholder').style.display = 'none';
  }

  // ── Wire static UI ─────────────────────────────────────────────────────────

  document.addEventListener('DOMContentLoaded', function () {
    _el('btn-preview-refresh').addEventListener('click', refresh);
  });

  return { refresh: refresh };

})();
</script>
