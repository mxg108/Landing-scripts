<!--
  WebApp_Recipients.html — Section 1: Recipients Grid
  Included into Index.html via <?!= include('WebApp_Recipients') ?>

  Responsibilities:
    • Display an editable table (Email / Name / Unit) pre-populated from
      the Mass_Notification sheet via getInitialData().recipients.
    • Validate email addresses on blur (inline red highlight).
    • Let the operator add/remove rows manually.
    • Parse and import a .csv file (columns: email, name, unit).
    • Detect a paste from Google Sheets (tab-separated) and auto-fill rows.
    • Expose Recipients.getRows() so other sections can collect the data
      before calling saveRecipients() on the server.
-->

<section id="section-recipients">

  <!-- ── Looker fetch panel ─────────────────────────────────────────── -->
  <div class="looker-panel">

    <!--
      Hidden file input — triggered programmatically by the Import CSV button.
      accept=".csv" limits the OS file picker to CSV files only.

          <th class="rec-col-name">Name</th>
          <th class="rec-col-unit">Unit</th>
          <th class="rec-col-status">Status</th>
          <th class="rec-col-del"></th>
        </tr>
      </thead>
      <tbody id="rec-tbody"></tbody>
    </table>
    <div id="rec-empty">No recipients yet — add a row or import a CSV.</div>
  </div>

<script>
/**
 * Recipients module — manages the editable recipients grid.
 *
 * Exposed globally so Index.html and other sections can call:
 *   Recipients.init(rows, maxPerRun) — populate from server data
 *   Recipients.getRows()             — collect current grid data before saving
 *   Recipients.validate()            — highlight invalid emails, returns true/false
 */
const Recipients = (() => {

  // ── State ────────────────────────────────────────────────────────────────
  let _maxRows = 500;

  // Shorthand DOM lookups (functions so they always return live elements)
  const $tbody   = () => document.getElementById('rec-tbody');
  const $counter = () => document.getElementById('rec-counter');
  const $empty   = () => document.getElementById('rec-empty');

  // ── Public API ────────────────────────────────────────────────────────────

  /**
   * Populates the grid from the data returned by getInitialData().
   * Called once from Index.html after the server responds.
   *
   * @param {Array<{email,name,unit}>} rows
   * @param {number} maxPerRun — from cfg.maxPerRun, drives the counter cap
   */
  function init(rows, maxPerRun) {
    _maxRows = maxPerRun || 500;
    (rows || []).forEach(r => _addRow(r));
    _refresh();
  }

  /**
   * Returns the current grid contents as an array of plain objects,
   * filtering out any rows with no email (blank rows are ignored).
   *
   * Called by Index.html before invoking saveRecipients() on the server.
   *
   * @return {Array<{email:string, name:string, unit:string}>}
   */
  function getRows() {
    return Array.from($tbody().querySelectorAll('tr')).map(tr => ({
      email: tr.querySelector('.rec-email').value.trim(),
      name:  tr.querySelector('.rec-name').value.trim(),
      unit:  tr.querySelector('.rec-unit').value.trim(),
    })).filter(r => r.email);
  }

  /**
   * Highlights invalid email addresses in red.
   * Returns true if all non-empty email fields are valid.
   * Called by Index.html before allowing a preview or send.
   *
   * @return {boolean}
   */
  function validate() {
    let allValid = true;
    $tbody().querySelectorAll('tr').forEach(tr => {
      const inp = tr.querySelector('.rec-email');
      const val = inp.value.trim();
      if (val === '') return; // blank rows are filtered out by getRows(), not an error here
      const ok = _validEmail(val);
      inp.classList.toggle('rec-invalid', !ok);
      inp.classList.toggle('rec-valid',    ok);
      if (!ok) allValid = false;
    });
    return allValid;
  }

  // ── Private helpers ───────────────────────────────────────────────────────

  /** Validates a single non-email field (name/unit): green if filled, red if empty. */
  function _validateField(input, rowHasEmail) {
    if (!rowHasEmail) { input.classList.remove('rec-invalid', 'rec-valid'); return; }
    const filled = input.value.trim() !== '';
    input.classList.toggle('rec-invalid', !filled);
    input.classList.toggle('rec-valid',    filled);
  }

  /** Re-validates name and unit cells in a row after the email changes. */
  function _validateRowFields(tr, rowHasEmail) {
    _validateField(tr.querySelector('.rec-name'), rowHasEmail);
    _validateField(tr.querySelector('.rec-unit'), rowHasEmail);
  }

  /**
   * Creates and appends one table row.
   * data is optional — passing {} gives a blank row.
   */
  function _addRow(data) {
    data = data || {};
    const tr = document.createElement('tr');

    // We build the cell structure directly. Each cell holds one <input>.
    // _esc() prevents data values that contain quotes from breaking the
    // value="" attribute (e.g. a name like O'Brien or an email with <).
    const statusBadge = _statusBadge(data.status || '');
    tr.innerHTML =
      '<td class="rec-col-num"></td>' +
      '<td><input class="rec-input rec-email" type="email"' +
           ' placeholder="resident@email.com"' +
           ' value="' + _esc(data.email || '') + '"></td>' +
      '<td><input class="rec-input rec-name" type="text"' +
           ' placeholder="First Last"' +
           ' value="' + _esc(data.name  || '') + '"></td>' +
      '<td><input class="rec-input rec-unit" type="text"' +
           ' placeholder="101"' +
           ' value="' + _esc(data.unit  || '') + '"></td>' +
      '<td class="rec-col-status">' + statusBadge + '</td>' +
      '<td><button class="rec-del-btn" title="Remove row">&#x2715;</button></td>';

    // Validate email on blur; also re-validate name/unit for the same row.
    tr.querySelector('.rec-email').addEventListener('blur', function () {
      const val = this.value.trim();
      if (val === '') {
        this.classList.remove('rec-invalid', 'rec-valid');
        _validateRowFields(tr, false);
        return;
      }
      const ok = _validEmail(val);
      this.classList.toggle('rec-invalid', !ok);
      this.classList.toggle('rec-valid',    ok);
      _validateRowFields(tr, true);
    });

    // Validate name/unit on blur when the row has an email.
    tr.querySelector('.rec-name').addEventListener('blur', function () {
      _validateField(this, tr.querySelector('.rec-email').value.trim() !== '');
    });
    tr.querySelector('.rec-unit').addEventListener('blur', function () {
      _validateField(this, tr.querySelector('.rec-email').value.trim() !== '');
    });

    // Delete button removes this row from the DOM.
    tr.querySelector('.rec-del-btn').addEventListener('click', function () {
      tr.remove();
      _refresh();
    });

    $tbody().appendChild(tr);
    _refresh();
  }

  /**
   * Re-numbers the # column and updates the counter badge.
   * Called after every row add or remove.
   */
  function _refresh() {
    const rows = Array.from($tbody().querySelectorAll('tr'));
    rows.forEach((tr, i) => {
      tr.querySelector('.rec-col-num').textContent = i + 1;
    });
    const n = rows.length;
    $counter().textContent = n + ' / ' + _maxRows;
    $counter().classList.toggle('rec-over-limit', n > _maxRows);
    $empty().style.display = n === 0 ? 'block' : 'none';
  }

  /** Simple but solid email regex — rejects missing @ or missing TLD. */
  function _validEmail(v) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
  }

  /**
   * Escapes characters that would break a value="" HTML attribute.
   * Prevents a name like O"Brien from closing the attribute early.
   */
  function _esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }

  /**
   * Returns a status badge <span> HTML string for a given status value.
   * Blank status → no badge rendered.
   */
  function _statusBadge(status) {
    if (!status) return '';
    const s = String(status).toUpperCase();
    if (s === 'PENDING') return '<span class="rec-status-badge rec-status-pending">PENDING</span>';
    if (s === 'REVIEW')  return '<span class="rec-status-badge rec-status-review">REVIEW</span>';
    return '<span class="rec-status-badge" style="background:#eee;color:#555;">' + _esc(status) + '</span>';
  }

  // ── CSV import ────────────────────────────────────────────────────────────

  /**
   * Parses the selected .csv file and adds a row for each data line.
   * Handles quoted fields (including quoted commas and escaped quotes).
   * Auto-detects and skips a header row (first cell has no @ sign).
   *
   * This runs entirely in the browser (FileReader API) — no server call needed.
   *
   * @param {Event} event — change event from the hidden <input type="file">
   */
  function handleCSV(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function (e) {
      const rows = _parseCSV(e.target.result);
      // If the first cell of the first row looks like a header (no @), skip it.
      const start = (rows.length > 0 && !_validEmail(rows[0][0])) ? 1 : 0;
      rows.slice(start).forEach(cols => {
        if (!cols[0]) return;
        _addRow({ email: cols[0], name: cols[1] || '', unit: cols[2] || '' });
      });
      event.target.value = ''; // reset so the same file can be imported again
    };
    reader.readAsText(file);
  }

  /**
   * RFC-4180-ish CSV parser.
   * Handles: quoted fields, commas inside quotes, "" as escaped quote,
   * both \r\n and \n line endings.
   *
   * @param  {string} text — raw file contents
   * @return {Array<string[]>} — 2D array of cell values
   */
  function _parseCSV(text) {
    return text.replace(/\r\n/g, '\n').split('\n').map(line => {
      const cols = [];
      let cur = '', inQuote = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') {
          // Two consecutive quotes inside a quoted field = literal "
          if (inQuote && line[i + 1] === '"') { cur += '"'; i++; }
          else inQuote = !inQuote;
        } else if (ch === ',' && !inQuote) {
          cols.push(cur.trim()); cur = '';
        } else {
          cur += ch;
        }
      }
      cols.push(cur.trim());
      return cols;
    }).filter(r => r.some(c => c)); // drop entirely blank lines
  }

  // ── Paste from Google Sheets ──────────────────────────────────────────────
  //
  // When a user selects cells in Google Sheets and presses Cmd/Ctrl+C, the
  // clipboard contains tab-separated values (\t between columns, \n between
  // rows). We intercept paste events inside the table and auto-fill rows
  // instead of pasting raw text into a single cell.

  document.addEventListener('paste', function (e) {
    // Only fire when the user is pasting inside the recipients table.
    if (!e.target.closest('#rec-table')) return;

    const text = (e.clipboardData || window.clipboardData).getData('text');
    // If there are no tabs or newlines it's a plain single-value paste —
    // let the browser handle it normally inside the focused input.
    if (!text.includes('\t') && !text.includes('\n')) return;

    e.preventDefault(); // stop the browser from inserting raw text
    text.replace(/\r\n/g, '\n').trim().split('\n').forEach(line => {
      if (!line.trim()) return;
      const cols = line.split('\t');
      _addRow({ email: cols[0] || '', name: cols[1] || '', unit: cols[2] || '' });
    });
  });

  // ── Return public interface ───────────────────────────────────────────────
  return { init, getRows, validate, addRow: _addRow, handleCSV };

})(); // end Recipients IIFE


// ── Toolbar wiring ──────────────────────────────────────────────────────────
//
// These live outside the module because they reference DOM elements by ID
// and run after the HTML above has been parsed.

document.getElementById('rec-add-btn').addEventListener('click', function () {
  Recipients.addRow({});
});

// The Import CSV button triggers the hidden file input.
// This pattern avoids styling a native <input type="file"> (notoriously hard).
document.getElementById('rec-csv-btn').addEventListener('click', function () {
  document.getElementById('rec-csv-input').click();
});

document.getElementById('rec-csv-input').addEventListener('change', function (e) {
  Recipients.handleCSV(e);
});

// ── Looker fetch ─────────────────────────────────────────────────────────────

(function () {
  const input  = document.getElementById('looker-property-input');
  const btn    = document.getElementById('looker-fetch-btn');
  const status = document.getElementById('looker-status-line');

  function setStatus(msg, cls) {
    status.textContent = msg;
    status.className   = cls || '';
    status.style.display = msg ? 'block' : 'none';
  }

  function setLoading(loading) {
    btn.disabled       = loading;
    input.disabled     = loading;
    btn.textContent    = loading ? 'Fetching…' : 'Fetch recipients';
  }

  btn.addEventListener('click', function () {
    const propertyName = input.value.trim();
    if (!propertyName) {
      setStatus('Enter a property name first.', 'looker-status-error');
      input.focus();
      return;
    }

    setLoading(true);
    setStatus('Contacting Looker — this may take a few seconds…', 'looker-status-info');

    google.script.run
      .withSuccessHandler(function (res) {
        setLoading(false);
        if (!res.ok) {
          setStatus('Error: ' + res.error, 'looker-status-error');
          return;
        }

        // Clear the current grid and repopulate with sanitised rows.
        document.getElementById('rec-tbody').innerHTML = '';
        res.rows.forEach(function (r) { Recipients.addRow(r); });

        // Pin the campaign's Property Name to whatever Looker fetched for.
        // The server already wrote it to the Config sheet; this disables the
        // matching input in the Config section so the operator can't drift.
        if (typeof Config !== 'undefined' && Config.lockPropertyName) {
          Config.lockPropertyName(res.propertyName || propertyName);
        }

        setStatus(
          'Fetched ' + res.rawCount + ' raw rows → ' +
          res.pending + ' PENDING, ' +
          res.review  + ' REVIEW' +
          (res.review > 0 ? ' — review flagged rows before sending.' : ' — ready to send.'),
          res.review > 0 ? 'looker-status-error' : 'looker-status-ok'
        );
      })
      .withFailureHandler(function (err) {
        setLoading(false);
        setStatus('Unexpected error: ' + (err.message || err), 'looker-status-error');
      })
      .lookerSyncForWebApp(propertyName);
  });

  // Allow Enter key to trigger the fetch.
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') btn.click();
  });
})();

// ── Drag & drop CSV onto the toolbar ────────────────────────────────────────
(function () {
  var toolbar = document.querySelector('.rec-toolbar');

  toolbar.addEventListener('dragover', function (e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
    toolbar.classList.add('rec-drag-over');
  });

  toolbar.addEventListener('dragleave', function (e) {
    // Only remove highlight when leaving the toolbar entirely (not just
    // moving between its children).
    if (!toolbar.contains(e.relatedTarget)) {
      toolbar.classList.remove('rec-drag-over');
    }
  });

  toolbar.addEventListener('drop', function (e) {
    e.preventDefault();
    toolbar.classList.remove('rec-drag-over');
    var files = e.dataTransfer.files;
    if (!files || !files.length) return;
    var file = files[0];
    // Accept .csv files or text/csv MIME type
    if (!file.name.toLowerCase().endsWith('.csv') && file.type !== 'text/csv') return;
    // Reuse the handleCSV parser with a synthetic event-like object
    Recipients.handleCSV({ target: { files: files, value: '' } });
  });
})();
</script>
