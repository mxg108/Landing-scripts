<style>
  /* ── Section card ────────────────────────────────────────────────────────── */
  /* Section card scaffolding lives in Index.html. */

  /* ── Send summary card ───────────────────────────────────────────────────── */
  #send-summary {
    background: var(--bg);
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    border-radius: var(--radius-ctrl);
    padding: 14px 18px;
    margin-bottom: 20px;
    font-family: var(--font-mono);
    font-size: 0.82rem;
    color: var(--text);
    line-height: 1.7;
    display: none; /* shown when summary loads */
  }
  #send-summary strong {
    color: var(--accent);
    font-weight: 500;
  }

  /* ── Banners ─────────────────────────────────────────────────────────────── */
  .send-banner {
    border-radius: var(--radius-ctrl);
    padding: 12px 16px;
    margin-bottom: 16px;
    font-family: var(--font-mono);
    font-size: 0.8rem;
    line-height: 1.6;
    display: none;
  }
  .send-banner ul {
    margin: 6px 0 0 0;
    padding-left: 18px;
  }
  #send-error-banner {
    background: var(--error-bg);
    border: 1px solid var(--red);
    border-left: 4px solid var(--red);
    color: var(--error);
  }
  #send-warning-banner {
    background: var(--warning-bg);
    border: 1px solid var(--amber);
    border-left: 4px solid var(--amber);
    color: var(--warning);
  }
  #send-success-banner {
    background: var(--success-bg);
    border: 1px solid var(--green);
    border-left: 4px solid var(--green);
    color: var(--success);
  }

  /* ── Action row ──────────────────────────────────────────────────────────── */
  #send-actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
    margin-top: 4px;
  }

  /* ── Reset row (always visible, separated by a rule) ─────────────────────── */
  #send-reset-row {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }

  /* ── Buttons ─────────────────────────────────────────────────────────────── */
  .send-btn {
    font-family: var(--font-mono);
    font-size: 0.82rem;
    font-weight: 500;
    padding: 9px 22px;
    border-radius: var(--radius-ctrl);
    border: 1px solid transparent;
    cursor: pointer;
    transition: background .15s, opacity .15s, color .15s, border-color .15s;
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }
  .send-btn:disabled { opacity: .5; cursor: default; }

  #btn-send-primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  #btn-send-primary:hover:not(:disabled) {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
  }

  #btn-send-proceed {
    background: var(--amber);
    color: #fff;
    border-color: var(--amber);
    display: none;
  }
  #btn-send-proceed:hover:not(:disabled) {
    background: var(--warning);
    border-color: var(--warning);
  }

  #btn-send-cancel {
    background: transparent;
    color: var(--text);
    border-color: var(--border);
    display: none;
  }
  #btn-send-cancel:hover:not(:disabled) { background: var(--bg); }

  #btn-send-reset {
    background: transparent;
    color: var(--accent);
    border-color: var(--accent);
  }
  #btn-send-reset:hover:not(:disabled) { background: var(--bg); }

  /* ── Spinner ─────────────────────────────────────────────────────────────── */
  .send-spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>

<section id="section-send">
  <h2>Send</h2>

  <!-- Summary of what will be sent (populated after first load) -->
  <div id="send-summary"></div>

  <!-- Error banner -->
  <div id="send-error-banner" class="send-banner">
    <strong>Cannot send — please fix the following:</strong>
    <ul id="send-error-list"></ul>
  </div>

  <!-- Warning / confirm banner -->
  <div id="send-warning-banner" class="send-banner">
    <strong>&#9888;&#xFE0F; Review before sending:</strong>
    <ul id="send-warning-list"></ul>
  </div>

  <!-- Success banner -->
  <div id="send-success-banner" class="send-banner">
    <span id="send-success-text"></span>
    <span id="send-countdown"></span>
  </div>

  <!-- Action buttons -->
  <div id="send-actions">
    <button type="button" id="btn-send-primary" class="send-btn">
      &#128235; Send Notifications
    </button>
    <button type="button" id="btn-send-proceed" class="send-btn">
      &#9888;&#xFE0F; Proceed Anyway
    </button>
    <button type="button" id="btn-send-cancel" class="send-btn">
      Cancel
    </button>
  </div>

  <!-- Reset row — always visible below a separator line -->
  <div id="send-reset-row">
    <button type="button" id="btn-send-reset" class="send-btn">
      &#x1F504; Reset for next campaign
    </button>
  </div>
</section>

<script>
/**
 * Send module — handles the send / confirm / reset flow.
 *
 * States:
 *   idle       → "Send Notifications" button visible
 *   loading    → button shows spinner + disabled
 *   warnings   → warning banner + "Proceed" / "Cancel" buttons
 *   errors     → error banner shown, send button re-enabled
 *   success    → success banner + 5-second auto-reset countdown
 */
const Send = (() => {

  var _pendingWarnings = [];
  var _autoResetTimer  = null;   // holds the setInterval id during countdown

  // ── DOM refs (safe after DOMContentLoaded) ─────────────────────────────────

  function _el(id) { return document.getElementById(id); }

  // ── State management ───────────────────────────────────────────────────────

  function _setState(state, data) {
    var btnPrimary  = _el('btn-send-primary');
    var btnProceed  = _el('btn-send-proceed');
    var btnCancel   = _el('btn-send-cancel');
    var btnReset    = _el('btn-send-reset');
    var errBanner   = _el('send-error-banner');
    var warnBanner  = _el('send-warning-banner');
    var succBanner  = _el('send-success-banner');
    var countdown   = _el('send-countdown');

    // Cancel any running auto-reset timer when changing state.
    _clearCountdown();

    // Reset to defaults first
    btnPrimary.style.display  = '';
    btnProceed.style.display  = 'none';
    btnCancel.style.display   = 'none';
    errBanner.style.display   = 'none';
    warnBanner.style.display  = 'none';
    succBanner.style.display  = 'none';
    countdown.innerHTML       = '';
    btnPrimary.disabled       = false;
    btnPrimary.innerHTML      = '&#128235; Send Notifications';

    // Reset button is always enabled except while loading or resetting.
    btnReset.disabled         = false;
    btnReset.innerHTML        = '&#x1F504; Reset for next campaign';

    if (state === 'loading') {
      btnPrimary.disabled     = true;
      btnPrimary.innerHTML    = '<span class="send-spinner"></span> Sending\u2026';
      btnReset.disabled       = true;

    } else if (state === 'saving') {
      btnPrimary.disabled     = true;
      btnPrimary.innerHTML    = '<span class="send-spinner"></span> Saving\u2026';
      btnReset.disabled       = true;

    } else if (state === 'warnings') {
      _el('send-warning-list').innerHTML = (data || [])
        .map(function (w) { return '<li>' + _esc(w) + '</li>'; }).join('');
      warnBanner.style.display  = 'block';
      btnPrimary.style.display  = 'none';
      btnProceed.style.display  = '';
      btnCancel.style.display   = '';

    } else if (state === 'errors') {
      _el('send-error-list').innerHTML = (data || [])
        .map(function (e) { return '<li>' + _esc(e) + '</li>'; }).join('');
      errBanner.style.display = 'block';

    } else if (state === 'success') {
      _el('send-success-text').innerHTML =
        '&#9989; Sent <strong>' + data.count + '</strong> email' +
        (data.count !== 1 ? 's' : '') + ' successfully. ' +
        'Run Log row: <strong>' + data.runLogRow + '</strong>. ';
      succBanner.style.display  = 'block';
      btnPrimary.style.display  = 'none';

      // Start 5-second auto-reset countdown.
      _startCountdown(5);
    }
  }

  // ── Auto-reset countdown ───────────────────────────────────────────────────

  function _startCountdown(seconds) {
    var remaining = seconds;
    var countdown = _el('send-countdown');
    countdown.innerHTML = '&nbsp;Resetting in <strong>' + remaining + 's</strong>\u2026 ' +
      '<a href="#" id="send-reset-now" style="color:#166534;">Reset now</a>';

    document.getElementById('send-reset-now').addEventListener('click', function (e) {
      e.preventDefault();
      _clearCountdown();
      _onResetClick();
    });

    _autoResetTimer = setInterval(function () {
      remaining--;
      if (remaining <= 0) {
        _clearCountdown();
        _onResetClick();
        return;
      }
      var cd = _el('send-countdown');
      if (cd) {
        cd.innerHTML = '&nbsp;Resetting in <strong>' + remaining + 's</strong>\u2026 ' +
          '<a href="#" id="send-reset-now" style="color:#166534;">Reset now</a>';
        document.getElementById('send-reset-now').addEventListener('click', function (e) {
          e.preventDefault();
          _clearCountdown();
          _onResetClick();
        });
      }
    }, 1000);
  }

  function _clearCountdown() {
    if (_autoResetTimer !== null) {
      clearInterval(_autoResetTimer);
      _autoResetTimer = null;
    }
  }

  // ── Send flow ──────────────────────────────────────────────────────────────

  /**
   * Step 1: save the current recipients grid to the sheet, then send.
   * Called when the primary "Send" button is clicked.
   */
  function _onSendClick() {
    if (!Recipients.validate()) {
      _setState('errors', ['One or more recipient email addresses are invalid. Please fix the highlighted rows.']);
      return;
    }
    _setState('saving');
    google.script.run
      .withSuccessHandler(function () { _callSend(false); })
      .withFailureHandler(_onErr)
      .saveRecipients(Recipients.getRows());
  }

  /**
   * Step 2: call webAppSend() on the server.
   * @param {boolean} skipWarnings
   */
  function _callSend(skipWarnings) {
    _setState('loading');
    google.script.run
      .withSuccessHandler(_handleSendResult)
      .withFailureHandler(_onErr)
      .webAppSend(skipWarnings);
  }

  /**
   * Handles the result from webAppSend().
   */
  function _handleSendResult(r) {
    if (r.requiresConfirm) {
      _pendingWarnings = r.warnings;
      _setState('warnings', r.warnings);
      return;
    }
    if (!r.ok) {
      _setState('errors', r.errors);
      return;
    }
    _setState('success', r);
  }

  // ── Reset flow ─────────────────────────────────────────────────────────────

  function _onResetClick() {
    _clearCountdown();
    var btn = _el('btn-send-reset');
    btn.disabled  = true;
    btn.innerHTML = '<span class="send-spinner" style="border-top-color:#15192D;border-color:rgba(21,25,45,.3);"></span> Resetting\u2026';

    google.script.run
      .withSuccessHandler(function (r) {
        if (r && !r.ok) {
          btn.disabled  = false;
          btn.innerHTML = '&#x1F504; Reset for next campaign';
          var succBanner = _el('send-success-banner');
          if (succBanner.style.display === 'block') {
            succBanner.innerHTML +=
              '<br><span style="color:#991B1B;">Reset failed: ' + _esc(r.error || 'unknown error') + '</span>';
          } else {
            _setState('errors', ['Reset failed: ' + _esc(r.error || 'unknown error')]);
          }
          return;
        }
        // Use the URL captured at page load (window.__webAppUrl) to avoid
        // GAS's internal redirect URLs, which cause a blank page on reload().
        window.location.assign(
          typeof __webAppUrl !== 'undefined' ? __webAppUrl : window.location.href
        );
      })
      .withFailureHandler(function (e) {
        btn.disabled  = false;
        btn.innerHTML = '&#x1F504; Reset for next campaign';
        _setState('errors', ['Reset failed: ' + (e && e.message ? e.message : String(e))]);
      })
      .webAppReset();
  }

  // ── Update summary card ────────────────────────────────────────────────────

  /** Renders the summary card from raw values. */
  function _setSummary(count, mode, prop, subject) {
    var summary = _el('send-summary');
    if (!summary) return;
    summary.innerHTML =
      '<strong>' + count + '</strong> recipient' + (count !== 1 ? 's' : '') +
      ' &nbsp;&middot;&nbsp; Mode: <strong>' + _esc(mode.toUpperCase()) + '</strong>' +
      ' &nbsp;&middot;&nbsp; Property: <strong>' + _esc(prop || '\u2014') + '</strong><br>' +
      '<span style="color:#888;font-size:12px;">Subject: ' + _esc(subject || '(no subject)') + '</span>';
    summary.style.display = 'block';
  }

  /**
   * Called by Index.html after initial data loads (camelCase cfg from server).
   */
  function updateSummary(recipientCount, cfg) {
    _setSummary(
      recipientCount,
      cfg.sendMode        || cfg.send_mode        || 'INDIVIDUAL',
      cfg.propertyName    || cfg.property_name    || '',
      cfg.subjectTemplate || cfg.subject_template || ''
    );
  }

  /**
   * Re-reads live values from the Recipients and Config modules.
   * Called by Preview after a successful render so the summary stays in sync.
   */
  function refresh() {
    if (typeof Config === 'undefined' || typeof Recipients === 'undefined') return;
    var vals  = Config.getValues();
    var count = Recipients.getRows().length;
    _setSummary(
      count,
      vals.send_mode        || 'INDIVIDUAL',
      vals.property_name    || '',
      vals.subject_template || ''
    );
  }

  // ── Utilities ──────────────────────────────────────────────────────────────

  function _onErr(e) {
    _setState('errors', ['Server error: ' + (e && e.message ? e.message : String(e))]);
  }

  function _esc(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  // ── Wire static UI (DOMContentLoaded) ─────────────────────────────────────

  document.addEventListener('DOMContentLoaded', function () {
    _el('btn-send-primary').addEventListener('click', _onSendClick);
    _el('btn-send-proceed').addEventListener('click', function () { _callSend(true); });
    _el('btn-send-cancel').addEventListener('click', function () { _setState('idle'); });
    _el('btn-send-reset').addEventListener('click', _onResetClick);
  });

  return { updateSummary: updateSummary, refresh: refresh };

})();
</script>
